---
# GitHub Actions workflow for commit message validation
# Validates commit messages against conventional commit format and other standards
# Checks message format, branch naming, author details, and signoff requirements
name: commit-check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: read-all

jobs:
  commit-check:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: commit-check/commit-check-action@b6819c7bfd40f576d670a78712646a67f2659ff3 # v2.18.2
        with:
          pr-title: true
        env:
          CCHK_SUBJECT_CAPITALIZED: false
          CCHK_SUBJECT_MAX_LENGTH: 72
          CCHK_IGNORE_AUTHORS: "copilot[bot],github-actions[bot],my-renovate[bot]"
          CCHK_BRANCH_IGNORE_AUTHORS: "copilot[bot],github-actions[bot],my-renovate[bot]"
