name: check-broken-links

on:
  schedule:
    - cron: "8 8 * * 0"
  pull_request:
    types: [opened, synchronize]
    paths:
      - .github/workflows/check-broken-links.yml
  push:
    branches:
      - main
    paths:
      - .github/workflows/check-broken-links.yml

permissions:
  contents: read

jobs:
  my-broken-link-checker:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # shortcut: zizmor wants "uses: $/" in the "uses: ./" steps, but actionlint 1.7.12
      # rejects it (https://github.com/rhysd/actionlint/issues/711) - switch once supported
      - name: Check - container
        uses: ./ # zizmor: ignore[self-repository]
        with:
          url: https://rust-lang.github.io/mdBook/
          cmd_params: --verbose --color=always --ignore-fragments --one-page-only --buffer-size=8192

      - name: Check - simple
        env:
          INPUT_URL: https://rust-lang.github.io/mdBook/
          INPUT_CMD_PARAMS: --verbose --color=always --ignore-fragments --one-page-only --buffer-size=8192
        run: ./entrypoint.sh

      - name: Check - simple - local pages
        env:
          INPUT_URL: https://my-testing-domain.test
          INPUT_PAGES_PATH: ./tests/
          INPUT_CMD_PARAMS: --skip-tls-verification --verbose --color=always --buffer-size=8192
        run: ./entrypoint.sh

  build-check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create web page
        run: |
          mkdir -v public
          cat > public/index.html << EOF
          <!DOCTYPE html>
          <html>
            <head>
              My page which will be stored on my-testing-domain.test domain
            </head>
            <body>
              Links:
              <ul>
                <li><a href="https://my-testing-domain.test">https://my-testing-domain.test</a></li>
                <li><a href="https://my-testing-domain.test:443">https://my-testing-domain.test:443</a></li>
              </ul>
            </body>
          </html>
          EOF

      - name: Check links using script
        env:
          INPUT_URL: https://my-testing-domain.test
          INPUT_PAGES_PATH: ./public/
          INPUT_CMD_PARAMS: --skip-tls-verification --verbose --color=always --buffer-size=8192
          INPUT_DEBUG: true
        run: ./entrypoint.sh

      - name: Check links using container
        uses: ./ # zizmor: ignore[self-repository]
        with:
          url: https://my-testing-domain.test
          pages_path: ./public/
          cmd_params: --skip-tls-verification --verbose --color=always --buffer-size=8192
          debug: true
