---
# GitHub Actions workflow for PR size labeling
# Automatically labels pull requests based on the number of changed lines
# https://github.com/CodelyTV/pr-size-labeler
name: pr-size-labeler

on:
  workflow_dispatch:
  pull_request:

permissions: read-all

jobs:
  pr-size-labeler:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      contents: read
      issues: write
    steps:
      - uses: codelytv/pr-size-labeler@3e1170d6309cd47d537ffd8b23854a8339057e9d # v1.10.5
